<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pensamiento Lógico">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#9d2ad8"/>
      <stop offset="0.45" stop-color="#8e05c2"/>
      <stop offset="1" stop-color="#700b97"/>
    </linearGradient>
    <radialGradient id="ojo" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#8e05c2"/>
      <stop offset="1" stop-color="#3e065f"/>
    </radialGradient>
    <radialGradient id="bola" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#8e05c2"/>
    </radialGradient>
    <linearGradient id="antena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e065f"/>
      <stop offset="1" stop-color="#700b97"/>
    </linearGradient>
  </defs>

  <!-- antena -->
  <rect x="30.4" y="4.5" width="3.2" height="9" rx="1.6" fill="url(#antena)"/>
  <circle cx="32" cy="3.4" r="3.1" fill="url(#bola)"/>

  <!-- cuerpo -->
  <rect x="8" y="13.5" width="48" height="42" rx="12" fill="url(#cuerpo)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="8" y="13.5" width="48" height="42" rx="12" fill="#ffffff" fill-opacity="0.05"/>

  <!-- visera -->
  <rect x="15.5" y="25" width="33" height="15" rx="7.5" fill="#000000" stroke="#8e05c2" stroke-opacity="0.45" stroke-width="1.2"/>

  <!-- ojos -->
  <ellipse cx="24.6" cy="32.5" rx="3.3" ry="4.3" fill="url(#ojo)"/>
  <ellipse cx="39.4" cy="32.5" rx="3.3" ry="4.3" fill="url(#ojo)"/>

  <!-- boca / raya -->
  <rect x="25" y="46.2" width="14" height="2.2" rx="1.1" fill="#000000" fill-opacity="0.5"/>
</svg>
